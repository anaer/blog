[project]
name = "gmeek"
version = "0.1.0"
description = "基于 GitHub Issues 与 Actions 的静态博客生成器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # GitHub API 与 HTTP
    "pygithub>=2.10.0",
    "requests>=2.34.2",

    # 模板与渲染
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "pymdown-extensions>=12.1",
    "pygments>=2.21.0",
    "beautifulsoup4>=4.15.0",

    # RSS
    "feedgen>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
