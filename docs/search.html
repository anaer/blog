<style>
body{
    box-sizing: border-box;
    min-width: 200px;
    max-width: 900px;
    margin: 20px auto;
    padding: 45px;
    font-size: 16px;
    font-family: sans-serif;
    line-height: 1.25;
}

.avatar {transition: 0.8s;}
.avatar:hover {transform: scale(1.15) rotate(360deg);}
#header{display:flex;padding-bottom:8px;border-bottom: 1px solid var(--borderColor-muted, var(--color-border-muted));margin-bottom: 16px;}
#footer {margin-top:64px; text-align: center;font-size: small;}

/* 图标统一为线性描边(icons.py 单一数据源): 覆盖 primer 的 .octicon{fill:currentColor}, 否则填充会破坏描边风格。
   必须额外带上 .markdown-body 前缀: github-markdown-css 的 `.markdown-body .octicon{fill:currentColor}`
   特异性(0,2,0)高于 `svg.octicon`(0,1,1), 正文区(代码块控件/标题折叠)的图标会被整体填实、看起来缺块 */
.markdown-body svg.octicon,svg.octicon{fill:none;stroke:currentColor}

/* 站内搜索框: 列表页 / 标签页 / 文章页共用同一组件(圆角输入框 + 图标提交按钮)。
   配色走主题变量, 明暗自适应; 窄屏保留但收窄, 不整块隐藏 */
.site-search{display:inline-flex;align-items:center;gap:4px;margin-right:8px;}
.site-search input[type="search"]{
    width:160px;max-width:40vw;padding:4px 8px;font-size:14px;
    border:1px solid var(--borderColor-default, var(--color-border-default));
    border-radius:6px;
    background:var(--bgColor-default, var(--color-canvas-default));
    color:var(--fgColor-default, var(--color-fg-default));
    outline:none;
}
.site-search input[type="search"]:focus{
    border-color:var(--fgColor-accent, var(--color-accent-fg));
    width:200px;
}
.site-search button{
    border:none;background:transparent;cursor:pointer;padding:4px;
    color:var(--fgColor-muted, var(--color-fg-muted));display:inline-flex;
}
@media (max-width: 767px) {
    .site-search{margin-right:4px;}
    .site-search input[type="search"]{width:104px;}
    .site-search input[type="search"]:focus{width:132px;}
}

/* 标签: 底色与字色都由 --label-hue 按主题推导(同一色相, 明度反转), 不依赖 GitHub 的标签色。
   色相由标签名确定性派生, 见 Gmeek.py#deterministic_hue
   暗色下饱和度降低(45% → 30%)、底色更暗(22% → 18%), 与 WorkBuddy 暖灰底更融合;
   文字略微降亮(85% → 78%)避免刺眼 */
.Label{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: hsl(var(--label-hue, 210), 70%, 92%);
    color: hsl(var(--label-hue, 210), 80%, 26%);
}
.Label a{ color: inherit; text-decoration: none; }
[data-color-mode="dark"] .Label:not(.Label--solid){
    background: hsl(var(--label-hue, 210), 30%, 18%);
    color: hsl(var(--label-hue, 210), 78%, 80%);
}
/* 非色相派生的标签(评论数徽标): 沿用配置色 + 白字 */
.Label--solid{ color: #fff; }

</style>

<style>
/* 检索界面跟随站点主题: 变量命名与取值沿用 Primer 的两级回退 */
#search{
    /* Pagefind 的输入框高度、放大镜图标位置、清除按钮尺寸**全部**以 --pagefind-ui-scale 为基准
       (输入框 64*scale、图标 top 23*scale、清除按钮 top 3*scale / height 58*scale)。
       若只覆盖 height/font-size, 绝对定位的放大镜与清除按钮不会跟着变, 就会偏出垂直中心甚至溢出。
       故这里统一用缩放: 0.75 => 输入框 48px、字号 21*0.75≈16px, 与头部按钮高度相称。 */
    --pagefind-ui-scale: 0.75;
    --pagefind-ui-primary: var(--fgColor-accent, var(--color-accent-fg));
    --pagefind-ui-text: var(--fgColor-default, var(--color-fg-default));
    --pagefind-ui-background: var(--bgColor-default, var(--color-canvas-default));
    --pagefind-ui-border: var(--borderColor-default, var(--color-border-default));
    --pagefind-ui-font: inherit;
}
/* 清除按钮文字会随 scale 缩到 10.5px, 单独提回可读字号(不影响其高度与垂直居中) */
#search .pagefind-ui__search-clear{font-size:12px;}

/* Pagefind UI 1.5.2 用同一个 <p class="pagefind-ui__message"> 承载三种消息:
   loading("Searching [SEARCH_TERM]...")、零结果("No results for ...")、结果计数("N results for ...")。
   三者共用配色/字号; 但 spinner 只加在 loading 态——计数与零结果消息是终态,
   不该出现旋转的加载指示器。区分依据: 计数/零结果消息后恒接 <ol class="pagefind-ui__results">,
   loading 消息不接, 故用 :not(:has(+ ...)) 排除后两者。
   (:has() 不受支持时该 ::before 规则整体失效, 退化为"无 spinner", 不会误伤终态) */
#search .pagefind-ui__message{
    color:var(--fgColor-muted, var(--color-fg-muted));
    font-size:14px;
    display:flex;align-items:center;gap:8px;
}
#search .pagefind-ui__message:not(:has(+ .pagefind-ui__results))::before{
    content:"";
    width:12px;height:12px;
    border:2px solid var(--borderColor-default, var(--color-border-default));
    border-top-color:var(--color-accent-fg);
    border-radius:50%;
    animation:pagefind-loading-spin .8s linear infinite;
}
@keyframes pagefind-loading-spin{to{transform:rotate(360deg);}}

/* 中文短词精确匹配块: 独立容器, 插在 Pagefind 结果之上, 两轨并列展示(不隐藏 Pagefind 结果)。
   类名刻意不沿用 .pagefind-ui__result, 避免被结果装饰器当成 Pagefind 卡片二次加工 */
#search .exact-matches{margin:0 0 8px;}
/* 兜底: 只靠 UA 的 [hidden]{display:none} 会被任何 display 声明覆盖, 显式钉死 */
#search .exact-matches[hidden]{display:none;}
#search .exact-matches__head{margin:0 0 6px;font-weight:600;font-size:14px;color:var(--fgColor-muted, var(--color-fg-muted));}
#search .exact-matches__list{list-style:none;margin:0 0 14px;padding:0;}
#search .exact-matches__item{padding:6px 0;border-bottom:1px solid var(--borderColor-muted, var(--color-border-muted));}
#search .exact-matches__item:last-child{border-bottom:0;}
#search .exact-matches__link{color:var(--fgColor-accent, var(--color-accent-fg));text-decoration:none;font-size:16px;line-height:1.5;}
#search .exact-matches__link:hover{text-decoration:underline;}

/* 结果标题行: 标题 + 标签 + issue 入口 同排, 空间不足时整体换行 */
#search .pagefind-ui__result-title{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:16px;
}
/* 标题后的元信息: 文章标签 + issue 入口(由脚本按索引 meta 注入, 见 block script) */
#search .pagefind-ui__result-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#search .pagefind-ui__result-labels{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none;}
#search .pagefind-ui__result-labels li{list-style:none;margin:0;padding:0;}
/* 标签 chip 配色由 base.html 的 .Label 提供(--label-hue 由脚本按索引 meta 注入);
   这里只控尺寸/边距, 让 chip 与 post.html / plist.html 上的标签视觉一致 */
#search .pagefind-ui__result-labels a.Label{
    font-size:12px;line-height:1.7;padding:0 8px;border-radius:10px;
    text-decoration:none;
    transition:filter .15s ease;
}
#search .pagefind-ui__result-labels a.Label:hover{filter:brightness(1.08);}
#search .pagefind-ui__result-source{
    display:inline-flex;color:var(--fgColor-muted, var(--color-fg-muted));
    opacity:.7;transition:opacity .2s;
}
#search .pagefind-ui__result-source:hover{opacity:1;}

#searchTitle{margin:auto 0;font-size:35px;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.title-right{display:flex;margin:auto 0 0 auto;}
.title-right .circle{padding:14px 16px;margin-right:8px;}

@media (max-width: 600px) {
    body { padding: 8px;}
    #searchTitle{display:none;}
}
</style>

    // 索引内每篇文章的 meta(labels/source) 按 url 收集, 供结果渲染后补挂页脚
    var metaByUrl = {};

    function absUrl(u) {
        try { return new URL(u, window.location.href).href; } catch (e) { return u; }
    }
    // 历史上为"防御 Pagefind result.url 与 DOM href 编码/前缀差异"曾同时按 abs URL + pathname 索引;
    // 当前部署下两者派生同一字符串, 双键冗余已不再必要, 直接按 abs URL 查即可
    function lookup(u) {
        var abs = absUrl(u);
        return metaByUrl[abs] || null;
    }
    function parseLabels(raw) {
        try {
            var v = JSON.parse(raw || "[]");
            return Array.isArray(v) ? v : [];
        } catch (e) { return []; }
    }

    // ---- 中文短词精确匹配(子串索引) ----
    // Pagefind 的中文索引是词级切分, 对 2 字短词不稳(实测标题内两字词约 1/3 搜不到目标文章)。
    // 构建期另出一份「标题 + 小节标题」子串索引(scripts/build_search_index.py), 这里按连续子串
    // 精确匹配补齐这一档; 结果插在 Pagefind 结果之上, 两轨并列展示, 不隐藏/不过滤 Pagefind 结果。
    var exactHost = document.getElementById("exactMatches");
    var exactEntries = null;      // null = 尚未加载
    var exactLoading = false;
    var exactTerm = "";
    var EXACT_MIN_LEN = 2;        // 单字查询噪声过大, 不触发
    var EXACT_MAX_HITS = 10;

    function loadExactIndex() {
        if (exactEntries !== null || exactLoading) { return; }
        exactLoading = true;
        fetch("https://anaer.github.io/blog/search-index/index.json")
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
                exactEntries = (d && d.entries) || [];
                renderExact(exactTerm);
            })
            .catch(function () { exactEntries = []; });   // 索引缺失时静默降级为原检索
    }

    function renderExact(term) {
        if (!exactHost) { return; }
        var q = (term || "").trim().toLowerCase();
        if (q.length < EXACT_MIN_LEN || !exactEntries || !exactEntries.length) {
            exactHost.hidden = true;
            exactHost.textContent = "";
            return;
        }
        var hits = [];
        for (var i = 0; i < exactEntries.length && hits.length < EXACT_MAX_HITS; i++) {
            var e = exactEntries[i];
            if ((e.t + " " + e.h).toLowerCase().indexOf(q) >= 0) { hits.push(e); }
        }
        exactHost.textContent = "";
        if (!hits.length) { exactHost.hidden = true; return; }

        var head = document.createElement("p");
        head.className = "exact-matches__head";
        head.textContent = "精确匹配 (" + hits.length + ")";
        exactHost.appendChild(head);

        var ol = document.createElement("ol");
        ol.className = "exact-matches__list";
        hits.forEach(function (e) {
            var li = document.createElement("li");
            li.className = "exact-matches__item";
            var a = document.createElement("a");
            a.className = "exact-matches__link";
            a.href = "https://anaer.github.io/blog/" + e.u;
            a.textContent = e.t || e.u;
            li.appendChild(a);
            ol.appendChild(li);
        });
        exactHost.appendChild(ol);
        exactHost.hidden = false;
    }

    // 把精确匹配块移进 Pagefind 的结果抽屉: 使其位于「输入框之下、Pagefind 结果之上」。
    // 依赖 .pagefind-ui__drawer / .pagefind-ui__results-area 两个公开类名; 找不到时保持原位,
    // 不报错也不阻断。已被移动过则直接返回(幂等, 防观察器自触发循环)。
    function placeExactBlock() {
        if (!exactHost) { return; }
        var host = document.getElementById("search");
        var drawer = host && host.querySelector(".pagefind-ui__drawer");
        if (!drawer || exactHost.parentNode === drawer) { return; }
        drawer.insertBefore(exactHost, drawer.querySelector(".pagefind-ui__results-area"));
    }

    // Pagefind 组件 UI 不提供结果模板, 故在其结果渲染后补挂页脚。
    // data 标记保证幂等: 补挂自身会再次触发观察器, 无此标记会陷入循环。
    function decorate(scope) {
        scope.querySelectorAll(".pagefind-ui__result").forEach(function (card) {
            if (card.dataset.gmDecorated) { return; }
            var link = card.querySelector(".pagefind-ui__result-link");
            var info = link && lookup(link.getAttribute("href"));
            if (!info) { return; }
            card.dataset.gmDecorated = "1";

            var meta = document.createElement("div");
            meta.className = "pagefind-ui__result-meta";

            if (info.labels.length) {
                var ul = document.createElement("ul");
                ul.className = "pagefind-ui__result-labels";
                info.labels.forEach(function (name) {
                    var li = document.createElement("li");
                    // 配色由 base.html 的 .Label 提供; --label-hue 按 labelHues 派生, 缺失回退 210(与 .Label 默认一致)
                    var hue = (labelHues && labelHues[name] !== undefined) ? labelHues[name] : 210;
                    var a = document.createElement("a");
                    a.className = "Label";
                    a.style.setProperty("--label-hue", hue);
                    // 跳转到 tag.html 的 hash 锚点; URL 编码与 tag.html 的 setClassDisplay(decodeURIComponent(...)) 闭环
                    a.href = "https://anaer.github.io/blog/tag.html#" + encodeURIComponent(name);
                    a.textContent = name;
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                meta.appendChild(ul);
            }
            if (info.source) {
                var a = document.createElement("a");
                a.className = "pagefind-ui__result-source";
                a.href = info.source;
                a.target = "_blank";
                a.rel = "noopener";
                a.title = "Issue";
                a.setAttribute("aria-label", "Issue");
                // 图标取自 base.html 的 renderIcon(单一数据源 icons.py), 与文章页 Issue 按钮同款
                a.innerHTML = (typeof renderIcon === "function") ? renderIcon("github", 16, "octicon") : "";
                meta.appendChild(a);
            }
            // 挂在标题元素内, 使其紧随标题同排; 标题行已是 flex, 空间不足时整体换行
            if (meta.childNodes.length) {
                var title = card.querySelector(".pagefind-ui__result-title");
                (title || card.querySelector(".pagefind-ui__result-inner") || card).appendChild(meta);
            }
        });
    }

    var ui = new PagefindUI({
        element: "#search",
        // 索引内的链接为站点根相对路径, 需按实际部署前缀补全
        baseUrl: "https://anaer.github.io/blog/",
        // pageSize 上调到 20, "Load more"触发频次从 ~30% 降到 ~10%(200 篇经验值),
        // 单次可见结果更完整; showSubResults 保留以提供段落级匹配高亮;
        // debounceTimeoutMs 250 略紧于 Pagefind 默认 300, 减少连续键入时的冗余查询
        pageSize: 20,
        showSubResults: true,
        showImages: false,
        debounceTimeoutMs: 250,
        processResult: function (result) {
            // 只存 abs URL——absUrl(result.url) 与 DOM 链接 href 在当前部署下派生同一字符串
            var m = result.meta || {};
            var info = { labels: parseLabels(m.labels), source: m.source || "" };
            metaByUrl[absUrl(result.url)] = info;
            return result;
        },
        // Pagefind 每次查询前都会调用 processTerm(已按其 debounceTimeoutMs 去抖),
        // 借此触发子串检索, 无需另外监听输入事件
        processTerm: function (term) {
            exactTerm = term || "";
            loadExactIndex();
            renderExact(exactTerm);
            return term;
        }
    });

    var host = document.getElementById("search");
    if (host) {
        placeExactBlock();
        decorate(host);
        // requestAnimationFrame 节流: Pagefind 渲染结果时会插入多个 DOM 节点,
        // 子树 MutationObserver 在每次插入都触发, 同帧内多次触发合并为一次 decorate,
        // 减少 querySelectorAll 反复扫描; decorate 自身已有 data-gmDecorated 幂等标记,
        // 节流不改变结果。
        var rafPending = false;
        new MutationObserver(function () {
            if (rafPending) { return; }
            rafPending = true;
            requestAnimationFrame(function () {
                rafPending = false;
                decorate(host);
                // 结果抽屉可能被 Pagefind 重绘, 兜底把精确匹配块放回原位置(幂等)
                placeExactBlock();
            });
        }).observe(host, { childList: true, subtree: true });
    }

    // 承接列表页搜索框提交的 ?q=
    var term = new URLSearchParams(window.location.search).get("q");
    if (term) { ui.triggerSearch(term); }
});
</script>

</html>
