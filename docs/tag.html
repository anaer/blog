<style>
body{
    box-sizing: border-box;
    min-width: 200px;
    max-width: 900px;
    margin: 20px auto;
    padding: 45px;
    font-size: 16px;
    font-family: sans-serif;
    line-height: 1.25;
}

.avatar {transition: 0.8s;}
.avatar:hover {transform: scale(1.15) rotate(360deg);}
#header{display:flex;padding-bottom:8px;border-bottom: 1px solid var(--borderColor-muted, var(--color-border-muted));margin-bottom: 16px;}
#footer {margin-top:64px; text-align: center;font-size: small;}

/* 图标统一为线性描边(icons.py 单一数据源): 覆盖 primer 的 .octicon{fill:currentColor}, 否则填充会破坏描边风格。
   必须额外带上 .markdown-body 前缀: github-markdown-css 的 `.markdown-body .octicon{fill:currentColor}`
   特异性(0,2,0)高于 `svg.octicon`(0,1,1), 正文区(代码块控件/标题折叠)的图标会被整体填实、看起来缺块 */
.markdown-body svg.octicon,svg.octicon{fill:none;stroke:currentColor}

/* 站内搜索框: 列表页 / 标签页 / 文章页共用同一组件(圆角输入框 + 图标提交按钮)。
   配色走主题变量, 明暗自适应; 窄屏保留但收窄, 不整块隐藏 */
.site-search{display:inline-flex;align-items:center;gap:4px;margin-right:8px;}
.site-search input[type="search"]{
    width:160px;max-width:40vw;padding:4px 8px;font-size:14px;
    border:1px solid var(--borderColor-default, var(--color-border-default));
    border-radius:6px;
    background:var(--bgColor-default, var(--color-canvas-default));
    color:var(--fgColor-default, var(--color-fg-default));
    outline:none;
}
.site-search input[type="search"]:focus{
    border-color:var(--fgColor-accent, var(--color-accent-fg));
    width:200px;
}
.site-search button{
    border:none;background:transparent;cursor:pointer;padding:4px;
    color:var(--fgColor-muted, var(--color-fg-muted));display:inline-flex;
}
@media (max-width: 767px) {
    .site-search{margin-right:4px;}
    .site-search input[type="search"]{width:104px;}
    .site-search input[type="search"]:focus{width:132px;}
}

/* 标签: 底色与字色都由 --label-hue 按主题推导(同一色相, 明度反转), 不依赖 GitHub 的标签色。
   色相由标签名确定性派生, 见 Gmeek.py#deterministic_hue
   暗色下饱和度降低(45% → 30%)、底色更暗(22% → 18%), 与 WorkBuddy 暖灰底更融合;
   文字略微降亮(85% → 78%)避免刺眼 */
.Label{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: hsl(var(--label-hue, 210), 70%, 92%);
    color: hsl(var(--label-hue, 210), 80%, 26%);
}
.Label a{ color: inherit; text-decoration: none; }
[data-color-mode="dark"] .Label:not(.Label--solid){
    background: hsl(var(--label-hue, 210), 30%, 18%);
    color: hsl(var(--label-hue, 210), 78%, 80%);
}
/* 非色相派生的标签(评论数徽标): 沿用配置色 + 白字 */
.Label--solid{ color: #fff; }

</style>

function renderIcon(name, size, cls){
    size = size || 16;
    cls = (cls === undefined) ? "octicon" : cls;
    var inner = (window.IconList && IconList[name]) || "";
    var clsAttr = cls ? ' class="' + cls + '"' : "";

function changeLight(){
    document.getElementsByTagName("html")[0].attributes.getNamedItem("data-color-mode").value="light";
    document.getElementById("themeSwitch").innerHTML=IconList["sun"];
    document.getElementById("themeSwitch").style.color="#ff5000";

}
function modeSwitch(){
    // 明暗状态取自 data-color-mode; 不可按下标取属性——<html> 的首个属性是 lang
    var root=document.getElementsByTagName("html")[0];
    if(root.getAttribute("data-color-mode")=="light"){changeDark();localStorage.setItem("meek_theme","dark");}
    else{changeLight();localStorage.setItem("meek_theme","light");}
}
function utterancesTheme(theme){
    const message = {type: 'set-theme',theme: theme};
    const iframe = document.getElementsByClassName('utterances-frame')[0];
    iframe.contentWindow.postMessage(message, 'https://utteranc.es');
}

function showList(labelsCount){
    let SideNav=document.getElementsByClassName("SideNav")[0];
    SideNav.classList.add("border");
    let taglabel=document.getElementById("taglabel");
    labelsCount["All"]=0;
    for (let key in jsonData) {
        if (Array.isArray(jsonData[key]['labels'])) {
            labelsCount["All"]++;
            for (let label of jsonData[key]['labels']) {
                labelsCount[label] = (labelsCount[label] || 0) + 1;
            }
        }
    }

    let sortedLabelsList = Object.keys(labelsCount).sort((a, b) => labelsCount[b] - labelsCount[a]);
    for (let label of sortedLabelsList) {
        tagList.push(label);
        let showLabels = document.createElement("button");
        showLabels.setAttribute("class", "Label");
        showLabels.setAttribute("style", "padding:4px;");
        if (labelHues[label] !== undefined) { showLabels.style.setProperty("--label-hue", labelHues[label]); }
        showLabels.innerHTML="&nbsp;&nbsp;"+label+" ";
        showLabels.setAttribute("onclick", "javascript:updateShowTag('" + label + "');");

        let LabelNum=document.createElement("span");
        LabelNum.setAttribute("class","Counter");
        LabelNum.innerHTML=labelsCount[label];
        showLabels.appendChild(LabelNum);
        taglabel.appendChild(showLabels);
    }

    for(i in jsonData){
        let div=document.createElement("div");
        div.setAttribute("class","lists "+jsonData[i]['labels'].join(" "));
        let item=document.createElement("a");
        item.setAttribute("class","SideNav-item d-flex flex-items-center flex-justify-between");
        item.setAttribute("href",jsonData[i]['postUrl']);

        let center=document.createElement("div");
        center.setAttribute("class","d-flex flex-items-center");

        // 图标统一经 renderIcon 生成(单一数据源 icons.py)
        if(typeof renderIcon === 'function'){
            center.insertAdjacentHTML('beforeend', renderIcon('post', 16, 'SideNav-icon octicon'));
        }

        let title=document.createElement("span");
        title.setAttribute("class","listTitle");
        title.innerHTML=jsonData[i]['postTitle'];
        center.appendChild(title);

        let listLabels=document.createElement("div");
        listLabels.setAttribute("class","listLabels");

        for(label of jsonData[i]['labels']){
            let LabelName=document.createElement("span");
            LabelName.setAttribute("class","Label LabelName");
            if (labelHues[label] !== undefined) { LabelName.style.setProperty("--label-hue", labelHues[label]); }
            LabelName.innerHTML=label;
            listLabels.appendChild(LabelName);
        }
        let LabelTime=document.createElement("span");
        LabelTime.setAttribute("class","Label LabelTime");
        LabelTime.style.setProperty("--label-hue", jsonData[i]['dateLabelHue']);
        LabelTime.innerHTML=jsonData[i]['createdDate'];
        listLabels.appendChild(LabelTime);

        item.appendChild(center);
        item.appendChild(listLabels);
        div.appendChild(item);
        SideNav.appendChild(div);
    }
}

function updateShowTag(label){
    if(window.location.hash.slice(1)!=encodeURIComponent(label)){
        window.location.hash="#"+(encodeURIComponent(label));
        setClassDisplay(label);
    }
}

function setClassDisplay(label){
    let lists = document.getElementsByClassName("lists");
    let tagTitle = document.getElementsByClassName("tagTitle")[0];
    tagTitle.innerHTML="Tag #"+label;
    document.title=label+" - Tip";
    document.querySelector(".site-search-input").value='';
    if(label=="All"){
        for(let i = 0; i < lists.length; i++){lists[i].style.display='block';}
        document.getElementsByClassName("notFind")[0].style.display='none';
    }
    else if(tagList.indexOf(label)!=-1){
        for(let i = 0; i < lists.length; i++){
            lists[i].style.display='none';
        }

        let labels = document.getElementsByClassName(label);
        for(let i = 0; i < labels.length; i++){
            labels[i].style.display='block';
        }
        document.getElementsByClassName("notFind")[0].style.display='none';
    }
    else{
        document.querySelector(".site-search-input").value=label;
        searchShow();
    }
}

function searchShow(){
    let lists = document.getElementsByClassName("lists");
    let tagTitle = document.getElementsByClassName("tagTitle")[0];
    let searchInput = document.querySelector(".site-search-input").value;
    tagTitle.innerHTML="Search #"+searchInput;
    if(searchInput==''){document.title="Search - Tip";}
    else{document.title=searchInput+" - Tip";}
    let a=0;
    window.location.hash="#"+(encodeURIComponent(searchInput));
    for(let i = 0; i < lists.length; i++){
        if(lists[i].childNodes[0].childNodes[0].childNodes[1].innerHTML.toUpperCase().indexOf(searchInput.toUpperCase())==-1){lists[i].style.display='none';}
        else{lists[i].style.display='block';a=a+1;}
    }
    if(a==0){
        let notFind=document.getElementsByClassName("notFind")[0];
        notFind.style.display='block';
        notFind.innerHTML='Not Find "'+searchInput+'"';
    }
    else{document.getElementsByClassName("notFind")[0].style.display='none';}
}
