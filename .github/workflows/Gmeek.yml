name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, deleted]
  # push:
    # branches: [main]

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      API_MODEL: ${{ secrets.API_MODEL }}

    if: github.event.repository.owner.id == github.event.sender.id
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blog

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Clone source code
        run: |
          git clone https://github.com/anaer/blog.git /opt/Gmeek

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd /opt/Gmeek/
          uv sync --frozen

      - name: Generate new html
        run: |
          if [ -f blogBase.json ]; then
              cp blogBase.json /opt/Gmeek/blogBase.json
          fi
          if [ -d backup ]; then
              cp -a backup /opt/Gmeek/backup
          fi
          cd /opt/Gmeek/
          ACTION="${{ github.event.action }}"
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "issues" ] && [ "$ACTION" = "deleted" ]; then
              # 删除事件: runOne 捕获 404 自动清理单条索引, 并移除已发布 HTML
              uv run --frozen python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
              rm -f ${{ github.workspace }}/docs/post/${{ github.event.issue.number }}.html
          elif [ "$EVENT" = "workflow_dispatch" ]; then
              # 手动触发: 全量重建并整体覆盖(顺带清理残留的已删帖子 HTML)
              uv run --frozen python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }}
              build_rc=$?
              if [ $build_rc -ne 0 ]; then
                echo "::error::全量重建失败(exit=$build_rc), 中止发布"
                exit 1
              fi
              # 安全闸门: 重建必须产出帖子, 否则中止发布, 避免清空线上站点
              if [ ! -d /opt/Gmeek/docs/post ] || [ -z "$(ls -A /opt/Gmeek/docs/post 2>/dev/null)" ]; then
                echo "::error::全量重建未产出任何帖子, 已中止发布以防止清空线上站点"
                exit 1
              fi
              rm -rf ${{ github.workspace }}/docs
              cp -a /opt/Gmeek/docs ${{ github.workspace }}
          else
              uv run --frozen python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          fi
          cp -a /opt/Gmeek/assets /opt/Gmeek/docs/assets
          cp -a /opt/Gmeek/docs ${{ github.workspace }}
          # docs/adr、glossary、review 仅存于 main, 不进 blog 分支
          rm -rf ${{ github.workspace }}/docs/adr ${{ github.workspace }}/docs/glossary ${{ github.workspace }}/docs/review
          cp -a /opt/Gmeek/backup ${{ github.workspace }}
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }}

      - name: Build search index
        # 必须在合并后的完整站点上建索引: 增量构建时 /opt/Gmeek/docs 只含本次重渲染的文章
        run: npx -y pagefind@1.5.2 --site docs

      - name: Update html
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Delete Workflow Runs
        uses: anaer/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
