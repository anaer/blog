name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  # push:
    # branches: [main]

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      API_MODEL: ${{ secrets.API_MODEL }}

    if: github.event.repository.owner.id == github.event.sender.id
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blog

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Clone source code
        run: |
          git clone https://github.com/anaer/blog.git /opt/Gmeek

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd /opt/Gmeek/
          uv sync --frozen

      - name: Generate new html
        run: |
          if [ -f blogBase.json ]; then
              cp blogBase.json /opt/Gmeek/blogBase.json
          fi
          if [ -d backup ]; then
              cp -a backup /opt/Gmeek/backup
          fi
          cd /opt/Gmeek/
          uv run --frozen python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          cp -a /opt/Gmeek/assets /opt/Gmeek/docs/assets
          cp -a /opt/Gmeek/docs ${{ github.workspace }}
          # docs/adr、glossary、review 仅存于 main, 不进 blog 分支
          rm -rf ${{ github.workspace }}/docs/adr ${{ github.workspace }}/docs/glossary ${{ github.workspace }}/docs/review
          cp -a /opt/Gmeek/backup ${{ github.workspace }}
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }}

      - name: Update html
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Delete Workflow Runs
        uses: anaer/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3
