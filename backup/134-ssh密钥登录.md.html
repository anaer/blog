
  <article class="markdown-body">
    <h2 id="ssh">生成SSH密钥对</h2>
<div class="highlight"><div class="code-block-wrapper"><div class="code-block-controls"><button class="code-toggle wrap-toggle" title="自动换行" aria-label="自动换行"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M12 3 6 9h3v4h2V9h3z"/></svg></button><button class="code-toggle lines-toggle" title="行号" aria-label="行号"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 3h1v1H2zM4.5 3h9v1h-9zM2 7h1v1H2zM4.5 7h9v1h-9zM2 11h1v1H2zM4.5 11h9v1h-9z"/></svg></button><button class="fold-btn" title="折叠" aria-label="折叠"><svg class="ic-fold" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 5 3.5 10h9z"/></svg></button><button class="copy-btn" title="复制" aria-label="复制"><svg width="18" height="18" viewBox="0 0 20 20" style="vertical-align:middle"><rect x="6" y="2" width="9" height="13" rx="2" fill="#555"/><rect x="3" y="5" width="9" height="13" rx="2" fill="#aaa"/></svg></button></div>
<pre><span></span><code><span class="cl">ssh-keygen -t rsa -b 4096 -C "your_email@example.com"  </span></code></pre></div></div>
<p><sub>/.ssh/id_rsa（私钥）<br />
</sub>/.ssh/id_rsa.pub（公钥）  </p>
<h2 id="putty">生成Putty私钥</h2>
<p>对于Putty需要使用自己的私钥, 所以需要加载id_rsa, 生成ppk格式的私钥  </p>
<p><img loading="lazy" decoding="async" width="1204" height="901" alt="Image" src="https://github.com/user-attachments/assets/9dbd53ae-d56a-492e-98b3-dfb6062a5431" />  </p>
<p>导入id_rsa, 生成id_rsa.ppk  </p>
<h2 id="_1">服务器设置</h2>
<p>将id_rsa.pub内容添加到服务器以下文件:<br />
~/.ssh/authorized_keys  </p>
  </article>
  
<style>
.code-block-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
}
.code-block-controls {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 2;
  display: flex;
  gap: 2px;
  opacity: 0.45;
  transition: opacity 0.2s;
}
.code-block-wrapper:hover .code-block-controls,
.code-block-wrapper:focus-within .code-block-controls {
  opacity: 1;
}
.fold-btn, .copy-btn, .code-toggle {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 16px;
  line-height: 1;
  outline: none;
  box-shadow: none;
  transition: background 0.2s;
}
.fold-btn:hover, .copy-btn:hover, .code-toggle:hover {
  background: var(--bgColor-muted, var(--color-canvas-subtle, #eee));
}
.fold-btn svg { display: block; }
.fold-btn .ic-fold { transition: transform 0.2s ease; }
.code-block-wrapper.folded .fold-btn .ic-fold { transform: rotate(180deg); }
.fold-btn, .code-toggle {
  color: #6e7681;
}
[data-color-mode="dark"] .fold-btn,
[data-color-mode="dark"] .code-toggle {
  color: #8b949e;
}
.code-toggle.off {
  color: #c6cbd1;
}
[data-color-mode="dark"] .code-toggle.off {
  color: #484f58;
}
.highlight code {
  counter-reset: cl;
}
.highlight .cl {
  display: block;
  counter-increment: cl;
  padding-left: 3.2em;
  position: relative;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.highlight .cl::before {
  content: counter(cl);
  position: absolute;
  left: 0;
  width: 2.4em;
  text-align: right;
  color: #6e7681;
  user-select: none;
}
[data-color-mode="dark"] .highlight .cl::before {
  color: #8b949e;
}
.code-block-wrapper.folded .cl ~ .cl {
  display: none;
}
/* 折叠态仅保留首行: 禁止换行, 长行横向滚动, 保证预览严格为一行 */
.code-block-wrapper.folded {
  overflow-x: auto;
}
.code-block-wrapper.folded pre,
.code-block-wrapper.folded .highlight .cl {
  white-space: nowrap;
  overflow-wrap: normal;
}
.code-block-wrapper.nowrap pre {
  white-space: pre;
}
.code-block-wrapper.nowrap .cl {
  overflow-wrap: normal;
}
.code-block-wrapper.nolines .cl {
  padding-left: 0;
}
.code-block-wrapper.nolines .cl::before {
  display: none;
}
/* 代码块语言标签: 左上角展示围栏语法(pygments 会丢弃语言类, 由渲染器回填) */
.code-block-wrapper.has-lang {
  padding-top: 22px;
}
.code-lang {
  position: absolute;
  top: 4px;
  left: 10px;
  z-index: 2;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  letter-spacing: .5px;
  color: #6e7681;
  background: var(--bgColor-muted, var(--color-canvas-subtle, #f6f8fa));
  padding: 0 6px;
  border-radius: 4px;
  user-select: none;
  opacity: .85;
}
[data-color-mode="dark"] .code-lang {
  color: #8b949e;
  background: var(--bgColor-muted, var(--color-canvas-subtle, #161b22));
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.code-block-wrapper').forEach(w => {
    // 单行代码块无需折叠
    if (w.querySelectorAll('.cl').length < 2) {
      const fb = w.querySelector('.fold-btn');
      if (fb) fb.style.display = 'none';
    }

    // 自动换行 / 行号开关(默认开启)
    const wrapBtn = w.querySelector('.wrap-toggle');
    const linesBtn = w.querySelector('.lines-toggle');
    wrapBtn.addEventListener('click', () => {
      wrapBtn.classList.toggle('off', w.classList.toggle('nowrap'));
    });
    linesBtn.addEventListener('click', () => {
      linesBtn.classList.toggle('off', w.classList.toggle('nolines'));
    });
  });

  // 复制功能(取 textContent, 折叠态也复制全文)
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.parentElement.parentElement.querySelector('pre code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 20 20" style="vertical-align:middle"><path fill="green" d="M7.629 15.314l-4.243-4.243 1.414-1.414 2.829 2.828 6.364-6.364 1.414 1.414z"/></svg>';
        setTimeout(() => {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 20 20" style="vertical-align:middle"><rect x="6" y="2" width="9" height="13" rx="2" fill="#555"/><rect x="3" y="5" width="9" height="13" rx="2" fill="#aaa"/></svg>';
        }, 1500);
      });
    });
  });

  // 折叠功能: 折叠时保留首行预览(箭头经 CSS 旋转, 不依赖文本)
  document.addEventListener('click', e => {
    const foldBtn = e.target.closest('.fold-btn');
    if (foldBtn) {
      const wrapper = foldBtn.closest('.code-block-wrapper');
      wrapper.classList.toggle('folded');
    }
  });
});
</script>
