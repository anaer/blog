<style>
.code-block-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
}
.code-block-controls {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 2;
  display: flex;
  gap: 2px;
  opacity: 0.45;
  transition: opacity 0.2s;
}
.code-block-wrapper:hover .code-block-controls,
.code-block-wrapper:focus-within .code-block-controls {
  opacity: 1;
}
.fold-btn, .copy-btn, .code-toggle {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 16px;
  line-height: 1;
  outline: none;
  box-shadow: none;
  transition: background 0.2s;
}
.fold-btn:hover, .copy-btn:hover, .code-toggle:hover {
  background: var(--bgColor-muted, var(--color-canvas-subtle, #eee));
}
.fold-btn svg { display: block; }
.fold-btn .ic-fold { transition: transform 0.2s ease; }
.code-block-wrapper.folded .fold-btn .ic-fold { transform: rotate(180deg); }
.fold-btn, .code-toggle, .copy-btn {
  color: #6e7681;
}
[data-color-mode="dark"] .fold-btn,
[data-color-mode="dark"] .code-toggle,
[data-color-mode="dark"] .copy-btn {
  color: #8b949e;
}
/* 复制成功反馈: 图标切换为 check 并短暂转为绿色 */
.copy-btn.copied {
  color: #1a7f37;
}
[data-color-mode="dark"] .copy-btn.copied {
  color: #3fb950;
}
.code-toggle.off {
  color: #c6cbd1;
}
[data-color-mode="dark"] .code-toggle.off {
  color: #484f58;
}
.highlight code {
  counter-reset: cl;
}
.highlight .cl {
  display: block;
  counter-increment: cl;
  padding-left: 3.2em;
  position: relative;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.highlight .cl::before {
  content: counter(cl);
  position: absolute;
  left: 0;
  width: 2.4em;
  text-align: right;
  color: #6e7681;
  user-select: none;
}
[data-color-mode="dark"] .highlight .cl::before {
  color: #8b949e;
}
.code-block-wrapper.folded .cl ~ .cl {
  display: none;
}
/* 折叠态仅保留首行: 禁止换行, 长行横向滚动, 保证预览严格为一行 */
.code-block-wrapper.folded {
  overflow-x: auto;
}
.code-block-wrapper.folded pre,
.code-block-wrapper.folded .highlight .cl {
  white-space: nowrap;
  overflow-wrap: normal;
}
.code-block-wrapper.nowrap pre {
  white-space: pre;
}
.code-block-wrapper.nowrap .cl {
  overflow-wrap: normal;
}
.code-block-wrapper.nolines .cl {
  padding-left: 0;
}
.code-block-wrapper.nolines .cl::before {
  display: none;
}
/* 代码块语言标签: 左上角展示围栏语法(pygments 会丢弃语言类, 由渲染器回填) */
.code-block-wrapper.has-lang {
  padding-top: 22px;
}
.code-lang {
  position: absolute;
  top: 4px;
  left: 10px;
  z-index: 2;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  letter-spacing: .5px;
  color: #6e7681;
  background: var(--bgColor-muted, var(--color-canvas-subtle, #f6f8fa));
  padding: 0 6px;
  border-radius: 4px;
  user-select: none;
  opacity: .85;
}
[data-color-mode="dark"] .code-lang {
  color: #8b949e;
  background: var(--bgColor-muted, var(--color-canvas-subtle, #161b22));
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.code-block-wrapper').forEach(w => {
    // 单行代码块无需折叠
    if (w.querySelectorAll('.cl').length < 2) {
      const fb = w.querySelector('.fold-btn');
      if (fb) fb.style.display = 'none';
    }

    // 自动换行 / 行号开关(默认开启)
    const wrapBtn = w.querySelector('.wrap-toggle');
    const linesBtn = w.querySelector('.lines-toggle');
    wrapBtn.addEventListener('click', () => {
      wrapBtn.classList.toggle('off', w.classList.toggle('nowrap'));
    });
    linesBtn.addEventListener('click', () => {
      linesBtn.classList.toggle('off', w.classList.toggle('nolines'));
    });
  });

  // 复制功能(取 textContent, 折叠态也复制全文)
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.parentElement.parentElement.querySelector('pre code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<svg class="octicon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg class="octicon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25ZM5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
        }, 1500);
      });
    });
  });

  // 折叠功能: 折叠时保留首行预览(箭头经 CSS 旋转, 不依赖文本)
  document.addEventListener('click', e => {
    const foldBtn = e.target.closest('.fold-btn');
    if (foldBtn) {
      const wrapper = foldBtn.closest('.code-block-wrapper');
      wrapper.classList.toggle('folded');
    }
  });
});
</script>
