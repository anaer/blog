<!DOCTYPE html>
<html lang="{{ blogBase['lang'] }}" data-color-mode="light" data-dark-theme="{{ blogBase['nightTheme'] }}" data-light-theme="{{ blogBase['dayTheme'] }}">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="content-type" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="{{ blogBase['homeUrl'] }}/assets/primer-subset.css" rel="stylesheet" />
    <!-- <link href="{{ blogBase['homeUrl'] }}/assets/font-awesome@6.5.1/css/all.min.css" rel="stylesheet" /> -->
    <!-- <link href="{{ blogBase['homeUrl'] }}/assets/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" /> -->
    {%- if blogBase['faviconUrl'] -%}
    <link rel="icon" href="{{ blogBase['faviconUrl'] }}">
    {%- endif -%}
    <!-- <script src="{{ blogBase['homeUrl'] }}/assets/vercount.js"></script> -->
    <script>
        // 访问统计在 DOM 就绪后注入, 不占用首屏关键路径
        document.addEventListener("DOMContentLoaded", function () {
            var s = document.createElement("script");
            s.src = "https://events.vercount.one/js";
            s.async = true;
            document.head.appendChild(s);
        });
    </script>
    <script>
        if(localStorage.getItem("meek_theme")==null){}
        else if(localStorage.getItem("meek_theme")=="dark"){document.getElementsByTagName("html")[0].attributes.getNamedItem("data-color-mode").value="dark";}
        else if(localStorage.getItem("meek_theme")=="light"){document.getElementsByTagName("html")[0].attributes.getNamedItem("data-color-mode").value="light";}
    </script>
    {% block head %}{% endblock %}
</head>
<style>
body{
    box-sizing: border-box;
    min-width: 200px;
    max-width: 900px;
    margin: 20px auto;
    padding: 45px;
    font-size: 16px;
    font-family: sans-serif;
    line-height: 1.25;
}

.avatar {transition: 0.8s;}
.avatar:hover {transform: scale(1.15) rotate(360deg);}
#header{display:flex;padding-bottom:8px;border-bottom: 1px solid var(--borderColor-muted, var(--color-border-muted));margin-bottom: 16px;}
#footer {margin-top:64px; text-align: center;font-size: small;}

/* 图标统一为线性描边(icons.py 单一数据源): 覆盖 primer 的 .octicon{fill:currentColor}, 否则填充会破坏描边风格 */
svg.octicon{fill:none;stroke:currentColor}

/* 站内搜索框: 列表页 / 标签页 / 文章页共用同一组件(圆角输入框 + 图标提交按钮)。
   配色走主题变量, 明暗自适应; 窄屏保留但收窄, 不整块隐藏 */
.site-search{display:inline-flex;align-items:center;gap:4px;margin-right:8px;}
.site-search input[type="search"]{
    width:160px;max-width:40vw;padding:4px 8px;font-size:14px;
    border:1px solid var(--borderColor-default, var(--color-border-default));
    border-radius:6px;
    background:var(--bgColor-default, var(--color-canvas-default));
    color:var(--fgColor-default, var(--color-fg-default));
    outline:none;
}
.site-search input[type="search"]:focus{
    border-color:var(--fgColor-accent, var(--color-accent-fg));
    width:200px;
}
.site-search button{
    border:none;background:transparent;cursor:pointer;padding:4px;
    color:var(--fgColor-muted, var(--color-fg-muted));display:inline-flex;
}
@media (max-width: 767px) {
    .site-search{margin-right:4px;}
    .site-search input[type="search"]{width:104px;}
    .site-search input[type="search"]:focus{width:132px;}
}

</style>
{% block style %}{% endblock %}

<body>
    <div id="header">{% block header %}{% endblock %}</div>
    <div id="content">{% block content %}{% endblock %}</div>
    <div id="footer">{% include 'footer.html' %}</div>

    <!-- oneko.js中用到document.body, 需要在body块中加载 否则提示为null -->
    <script src="{{ blogBase['homeUrl'] }}/assets/oneko.js/oneko.js"></script>
</body>
<script>
var IconList={{ IconList }};
var IconViewBox="{{ IconViewBox }}";
var IconStrokeWidth="{{ IconStrokeWidth }}";
// 统一图标渲染: 与 icons.py / macro.html 保持同一风格(24x24 线性描边), 供 toc.js、sections.js、tag.html 等复用
function renderIcon(name, size, cls){
    size = size || 16;
    cls = (cls === undefined) ? "octicon" : cls;
    var inner = (window.IconList && IconList[name]) || "";
    var clsAttr = cls ? ' class="' + cls + '"' : "";
    return '<svg' + clsAttr + ' width="' + size + '" height="' + size + '" viewBox="' + IconViewBox + '"'
        + ' fill="none" stroke="currentColor" stroke-width="' + IconStrokeWidth + '"'
        + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
}
var utterancesLoad=0;
if(localStorage.getItem("meek_theme")==null){localStorage.setItem("meek_theme","light");changeLight();}
else if(localStorage.getItem("meek_theme")=="dark"){changeDark();}
else if(localStorage.getItem("meek_theme")=="light"){changeLight();}

function changeDark(){
    document.getElementsByTagName("html")[0].attributes.getNamedItem("data-color-mode").value="dark";
    document.getElementById("themeSwitch").innerHTML=IconList["moon"];
    document.getElementById("themeSwitch").style.color="#00f0ff";
    if(utterancesLoad==1){utterancesTheme("dark-blue");}
}
function changeLight(){
    document.getElementsByTagName("html")[0].attributes.getNamedItem("data-color-mode").value="light";
    document.getElementById("themeSwitch").innerHTML=IconList["sun"];
    document.getElementById("themeSwitch").style.color="#ff5000";
    if(utterancesLoad==1){utterancesTheme("github-light");}
}
function modeSwitch(){
    // 明暗状态取自 data-color-mode; 不可按下标取属性——<html> 的首个属性是 lang
    var root=document.getElementsByTagName("html")[0];
    if(root.getAttribute("data-color-mode")=="light"){changeDark();localStorage.setItem("meek_theme","dark");}
    else{changeLight();localStorage.setItem("meek_theme","light");}
}
function utterancesTheme(theme){
    const message = {type: 'set-theme',theme: theme};
    const iframe = document.getElementsByClassName('utterances-frame')[0];
    iframe.contentWindow.postMessage(message, 'https://utteranc.es');
}

console.log("\n %c Gmeek {{ blogBase['GMEEK_VERSION'] }} %c https://github.com/Meekdai/Gmeek \n\n", "color: #fff; background-image: linear-gradient(90deg, rgb(47, 172, 178) 0%, rgb(45, 190, 96) 100%); padding:5px 1px;", "background-image: linear-gradient(90deg, rgb(45, 190, 96) 0%, rgb(255, 255, 255) 100%); padding:5px 0;");
</script>

{% block script %}{% endblock %}
</html>
